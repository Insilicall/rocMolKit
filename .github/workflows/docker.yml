name: docker-publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        # GHCR rejects uppercase characters in tag names.
        # Insilicall -> insilicall.
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build and push slim
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.slim
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/rocmolkit:slim
            ghcr.io/${{ steps.repo.outputs.owner }}/rocmolkit:${{ github.ref_name }}-slim
          build-args: |
            GPU_TARGETS=gfx1100;gfx1200;gfx90a;gfx942
          # Registry cache (stored as a ghcr image) instead of GitHub Actions
          # cache: the ROCm SDK (~4 GB) + RDKit source-build layers blow past
          # GHA's 10 GB cap with mode=max across two images, so they were evicted
          # and rebuilt every run (~40 min). The registry has no such cap, so the
          # expensive base layers persist and only the rocmolkit build re-runs.
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/rocmolkit:buildcache-slim
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/rocmolkit:buildcache-slim,mode=max

      - name: Build and push devel
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.devel
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/rocmolkit:devel
            ghcr.io/${{ steps.repo.outputs.owner }}/rocmolkit:${{ github.ref_name }}-devel
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/rocmolkit:buildcache-devel
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.owner }}/rocmolkit:buildcache-devel,mode=max
